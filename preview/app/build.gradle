plugins { id 'com.android.application' }

// Two separately installed apps from one codebase (owner decision, 25 October 2026; docs/SIGNING.md):
//   preview  = io.unifiedtv.preview, no HOME entry, signed exactly as before. It stays installed and is never replaced.
//   launcher = io.unifiedtv.launcher, an opt-in HOME entry (launcher/AndroidManifest.xml), signed with the owner's
//              durable key from its first install, so every later version updates in place and keeps its settings.
// The durable key: each of these four as a Gradle property (-PUNIFIEDTV_PREVIEW_KEYSTORE=... or
// ~/.gradle/gradle.properties) or an environment variable; the names predate the split and are kept so existing
// GitHub secrets still work. Used only when all four are set; otherwise the launcher is test-signed with the debug key,
// so CI and a plain build need no secrets. Never commit the keystore. Android refuses an update signed with another
// key: never uninstall a configured app to get round that; preview/tools/install_preview.py refuses a mismatch.
def previewKey = ['UNIFIEDTV_PREVIEW_KEYSTORE', 'UNIFIEDTV_PREVIEW_KEYSTORE_PASSWORD', 'UNIFIEDTV_PREVIEW_KEY_ALIAS', 'UNIFIEDTV_PREVIEW_KEY_PASSWORD']
        .collectEntries { name -> [(name): providers.gradleProperty(name).orElse(providers.environmentVariable(name)).getOrElse('')] }
def hasPreviewKey = previewKey.values().every { !it.trim().isEmpty() }

// Build identity for Settings > Updates & About (the owner couldn't tell builds apart: all said 0.5-preview). From CI's
// GITHUB_SHA (first 7 characters) and GITHUB_RUN_NUMBER; "local" otherwise. Checked to be plain hex and digits; no secret.
def buildSha = providers.environmentVariable('GITHUB_SHA').getOrElse('').trim().toLowerCase()
buildSha = buildSha ==~ /[0-9a-f]{7,40}/ ? buildSha.substring(0, 7) : 'local'
def buildRun = providers.environmentVariable('GITHUB_RUN_NUMBER').getOrElse('').trim()
buildRun = buildRun ==~ /[0-9]{1,10}/ ? buildRun : 'local'
def buildDate = new Date().format('yyyy-MM-dd', TimeZone.getTimeZone('UTC'))

android {
    namespace 'io.unifiedtv.preview'
    compileSdk 35
    defaultConfig { minSdk 28; targetSdk 33; versionCode 5; versionName '0.5-preview'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'BUILD_SHA', "\"${buildSha}\""
        buildConfigField 'String', 'BUILD_RUN', "\"${buildRun}\""
        buildConfigField 'String', 'BUILD_DATE', "\"${buildDate}\"" }
    buildFeatures { buildConfig true }
    sourceSets {
        main { manifest.srcFile 'AndroidManifest.xml'; java.srcDirs = ['src']; res.srcDirs = ['res'] }
        launcher { manifest.srcFile 'launcher/AndroidManifest.xml'; res.srcDirs = ['launcher/res'] }
        test { java.srcDirs = ['test'] }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        if (hasPreviewKey) {
            release {
                storeFile file(previewKey.UNIFIEDTV_PREVIEW_KEYSTORE)
                storePassword previewKey.UNIFIEDTV_PREVIEW_KEYSTORE_PASSWORD
                keyAlias previewKey.UNIFIEDTV_PREVIEW_KEY_ALIAS
                keyPassword previewKey.UNIFIEDTV_PREVIEW_KEY_PASSWORD
            }
        }
    }
    flavorDimensions = ['app']
    productFlavors {
        preview { dimension 'app'; applicationId 'io.unifiedtv.preview'; signingConfig signingConfigs.debug }
        launcher { dimension 'app'; applicationId 'io.unifiedtv.launcher'; signingConfig hasPreviewKey ? signingConfigs.release : signingConfigs.debug }
    }
    buildTypes {
        // Signing comes from the app (flavour above): the build type's own default would override it.
        debug { signingConfig = null }
        release { minifyEnabled false; signingConfig = null }
        // Review and hardware-check builds: their own identity (.devicecheck), always the local debug key, so they
        // install beside the real apps and can be removed without touching them.
        deviceCheck { initWith debug; signingConfig signingConfigs.debug; applicationIdSuffix '.devicecheck'; versionNameSuffix '-devicecheck'; matchingFallbacks = ['debug'] }
    }
    lint { abortOnError true; disable 'MissingTranslation' }
    testOptions {
        unitTests.includeAndroidResources = true
        // A test that never returns (an endless animation under Robolectric, a lost socket) fails here instead of
        // holding CI for hours.
        unitTests.all {
            timeout = java.time.Duration.ofMinutes(10)
            // Failures print their message and stack in the CI log, which is often the only report that can be read.
            testLogging { events 'failed'; exceptionFormat 'full' }
        }
    }
}
dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
