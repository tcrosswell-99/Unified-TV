name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lists-and-tools:
    name: Lists, tools and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools virtualenv
        run: |
          python3 -m venv tools/venv
          tools/venv/bin/pip install -q -r tools/requirements.txt
      - name: Example lists, README tables, shell helpers
        env:
          CLEANYOURTV_STRICT: ${{ github.event_name == 'push' && '1' || '' }}
        run: python3 -m unittest discover -s tests -v

  launcher:
    name: Launcher build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and release build
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease
      - name: The launcher stays small
        run: |
          size=$(stat -c %s launcher/app/build/outputs/apk/release/app-release.apk)
          echo "release APK: $((size / 1024)) KB"
          test "$size" -lt 524288 || { echo "APK is over 512 KB; the launcher targets 1 GB TVs, keep it small"; exit 1; }

  unified-preview:
    name: Standalone Unified TV Preview APK (test only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Build isolated APK and verify signature
        working-directory: preview
        run: |
          bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: UnifiedTV-Preview-test-only
          path: |
            preview/out/UnifiedTV-Preview.apk
            preview/out/SHA256SUMS.txt
            preview/out/manifest.txt
          retention-days: 14
          if-no-files-found: error
      # The launcher review build (io.unifiedtv.launcher.devicecheck) installs beside the preview and the real launcher
      # and can be removed without touching either. Test-signed: never the durable key, never a release.
      - uses: actions/upload-artifact@v4
        with:
          name: UnifiedTV-Launcher-review
          path: |
            preview/out/UnifiedTV-Launcher-review.apk
            preview/out/SHA256SUMS.txt
            preview/out/manifest-launcher-review.txt
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: UnifiedTV-test-and-lint-reports
          path: |
            preview/app/build/reports/
            preview/app/build/test-results/
          retention-days: 14

  launcher-ui:
    name: Launcher UI build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - name: Build with the example settings (no TMDB key, throwaway signing key)
        working-directory: launcher-ui
        run: |
          bash build.sh
          test -s CleanYourTV-UI.apk
