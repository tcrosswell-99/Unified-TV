# Unified TV must manually review upstream merges, particularly device package lists and workflows.
# The original upstream automation is not safe to repurpose as an unattended merge into this fork.
name: Upstream sync (manual review only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guidance:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "No automatic upstream merge is configured."
          echo "Compare with matheus-caldeira/cleanyourtv-ui and Gathin23/cleanyourtv."
          echo "Open a reviewed PR, test firmware-specific package lists and check licences first."
