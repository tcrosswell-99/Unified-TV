name: Add-ons

# Builds only what changed under addons/. Separate from CI on purpose: an add-on can't block or
# slow the launcher's build, and the launcher's size gate never sees add-on code.
on:
  pull_request:
    paths: ["addons/**"]
  push:
    branches: [main]
    paths: ["addons/**"]

permissions:
  contents: read

jobs:
  build:
    name: Build and test changed add-ons
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - name: Build and unit-test each add-on that changed
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A new branch has no "before" (all zeros) and a force-push can leave it unreachable:
          # build every add-on then, rather than failing on a bad diff base.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            changed=$(ls addons | while read -r a; do [ -d "addons/$a" ] && echo "$a"; done)
          else
            changed=$(git diff --name-only "$BASE" HEAD -- addons | awk -F/ 'NF>2 {print $2}' | sort -u)
          fi
          [ -z "$changed" ] && { echo "no add-on changed"; exit 0; }
          for a in $changed; do
            [ -d "addons/$a" ] || continue
            [ -f "addons/$a/gradlew" ] || { echo "addons/$a has no gradlew"; exit 1; }
            echo "::group::addons/$a"
            tasks=assembleRelease
            [ -d "addons/$a/app/src/test" ] && tasks="testReleaseUnitTest assembleRelease"
            (cd "addons/$a" && chmod +x gradlew && ./gradlew --no-daemon $tasks)
            echo "::endgroup::"
          done
